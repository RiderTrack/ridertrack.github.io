            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            position: relative;
            padding: 2rem 1rem;
        }

        /* Overlay oscuro para que el texto se lea bien sobre el fondo */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(6,3,15,0.45) 0%,
                rgba(6,3,15,0.60) 50%,
                rgba(6,3,15,0.88) 100%
            );
            z-index: 0;
            pointer-events: none;
        }

        /* === BACKGROUND NEON LINES (Simulated Roads) === */
        .bg-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            opacity: 0.3;
            background: 
                radial-gradient(ellipse at bottom, transparent 40%, var(--bg-dark) 100%),
                repeating-linear-gradient(90deg, transparent, transparent 48px, rgba(0, 208, 255, 0.1) 50px, transparent 52px),
                repeating-linear-gradient(0deg, transparent, transparent 48px, rgba(217, 39, 255, 0.05) 50px, transparent 52px);
            transform: perspective(500px) rotateX(60deg) scale(2);
            transform-origin: bottom;
        }

        /* Todos los elementos deben estar sobre el overlay */
        .graphic-container, .title-container, .subtitle,
        .auth-form, .divider, .social-container,
        .status-msg, .register-section, .forgot-section { position: relative; z-index: 1; }

        /* === CENTRAL GRAPHIC CONTAINER === */
        .graphic-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Neon Shield Background */
        .neon-shield {
            position: absolute;
            width: 80%;
            height: 80%;
            background: linear-gradient(135deg, rgba(217,39,255,0.2) 0%, rgba(0,208,255,0.2) 100%);
            clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
            border: 2px solid transparent;
            box-shadow: 
                0 0 20px var(--neon-pink),
                inset 0 0 20px var(--neon-blue);
            z-index: 1;
            border-radius: 10px;
        }
        
        .neon-shield::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 3px solid #fff;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
            box-shadow: 0 0 15px var(--neon-blue), inset 0 0 15px var(--neon-pink);
        }

        /* LOGO REAL */
        .rider-image {
            position: relative;
            z-index: 2;
            width: 120%;
            max-width: 320px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(0, 208, 255, 0.5));
        }

        /* === TYPOGRAPHY === */
        .title-container {
            text-align: center;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            position: relative;
        }

        .title {
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 2px;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.8);
            background: linear-gradient(90deg, #d927ff 0%, #a450ff 50%, #00d0ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            filter: drop-shadow(0 0 10px rgba(217, 39, 255, 0.8)) drop-shadow(0 0 20px rgba(0, 208, 255, 0.8));
        }

        .subtitle {
            font-size: 1rem;
            color: #ffffff;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        /* === FORM === */
        .auth-form {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
            z-index: 10;
        }

        .input-group input {
            width: 100%;
            padding: 14px 20px;
            background: rgba(20, 10, 35, 0.6);
            border: 1px solid rgba(0, 208, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .input-group input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 208, 255, 0.5), inset 0 0 10px rgba(0, 208, 255, 0.2);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            cursor: pointer;
        }

        .remember-me input {
            accent-color: var(--neon-pink);
        }

        .forgot-password {
            color: var(--neon-blue);
            text-decoration: none;
            transition: text-shadow 0.3s ease;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .forgot-password:hover {
            text-shadow: 0 0 8px var(--neon-blue);
        }

        /* Botones de acción del formulario */
        .btn-action {
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login {
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-pink));
            color: white;
            box-shadow: 0 0 15px rgba(217, 39, 255, 0.4);
        }

        .btn-login:hover {
            box-shadow: 0 0 25px rgba(217, 39, 255, 0.7);
            transform: translateY(-2px);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-register {
            background: transparent;
            color: #fff;
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 10px rgba(0, 208, 255, 0.2);
        }

        .btn-register:hover {
            background: rgba(0, 208, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 208, 255, 0.5);
        }

        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            margin: 10px 0;
            max-width: 340px;
        }

        /* === MENSAJE DE ESTADO === */
        .status-msg {
            width: 100%;
            max-width: 340px;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            display: none;
        }
        .status-msg.error   { display: block; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #f87171; }
        .status-msg.success { display: block; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.4); color: #34d399; }
        .status-msg.info    { display: block; background: rgba(0,208,255,0.1);   border: 1px solid rgba(0,208,255,0.3);  color: var(--neon-blue); }

        /* === SECCIÓN REGISTRO (oculta por defecto) === */
        .register-section {
            width: 100%;
            max-width: 340px;
            display: none;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
            z-index: 10;
        }
        .register-section.show { display: flex; }

        /* === SECCIÓN OLVIDÉ CONTRASEÑA (oculta por defecto) === */
        .forgot-section {
            width: 100%;
            max-width: 340px;
            display: none;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
            z-index: 10;
        }
        .forgot-section.show { display: flex; }

        /* === CAJA VERIFICACIÓN EMAIL === */
        .verify-box {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-align: center;
            padding: 20px;
            background: rgba(0,208,255,0.06);
            border: 1px solid rgba(0,208,255,0.25);
            border-radius: 12px;
        }
        .verify-box.show { display: flex; }
        .verify-icon { font-size: 2.5rem; }
        .verify-title { font-size: 1rem; font-weight: 700; color: var(--neon-blue); }
        .verify-text { font-size: 0.82rem; color: #aaa; line-height: 1.6; }
        .verify-email { font-weight: 700; color: #fff; font-size: 0.9rem; }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-back {
            background: none;
            border: none;
            color: var(--neon-blue);
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 4px;
        }

        /* Responsive scaling */
        @media (max-height: 800px) {
            .graphic-container { width: 200px; height: 200px; margin-top: 1rem; }
            .title { font-size: 2.8rem; }
            .subtitle { margin-bottom: 1rem; }
        }
    </style>
</head>
<body>

    <div class="bg-lines"></div>

    <!-- LOGO REAL -->

    <div class="status-msg" id="statusMsg"></div>

    <!-- === SECCIÓN LOGIN === -->
    <form class="auth-form" id="loginForm">

        <div class="input-group">

        <div class="form-options">

        <button type="submit" class="btn-action btn-login" id="btnLogin">Iniciar Sesión</button>

    </form>

    <!-- === SECCIÓN REGISTRO === -->
    <div class="register-section" id="registerSection">
        <div class="input-group">
            <input type="text" id="regNombre" placeholder="Tu nombre (opcional)">
        </div>
        <div class="input-group">
            <input type="email" id="regEmail" placeholder="Correo Electrónico">
        </div>
        <div class="input-group">
            <input type="password" id="regPass" placeholder="Contraseña (mín. 6 caracteres)">
        </div>
        <div class="input-group">
            <input type="password" id="regPass2" placeholder="Confirmar contraseña">
        </div>

        <!-- Caja de verificación pendiente -->
        <div class="verify-box" id="verifyBox">
            <div class="verify-icon">📬</div>
            <div class="verify-title">¡Revisa tu correo!</div>
            <div class="verify-text">Enviamos un enlace de confirmación a:</div>
            <div class="verify-email" id="verifyEmailLbl"></div>
            <div class="verify-text">Confirma tu email y luego inicia sesión.</div>
            <button type="button" class="btn-action btn-register" style="width:100%" onclick="reenviarVerificacion()">🔄 Reenviar correo</button>
        </div>

        <button type="button" class="btn-action btn-login" id="btnCrearCuenta" onclick="doRegistro()">⚡ Crear mi cuenta</button>

    </div>

    <div class="forgot-section" id="forgotSection">
        <p style="font-size:0.85rem; color:#aaa; text-align:center;">
            Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.
        </p>
        <div class="input-group">

        </div>
        <button type="button" class="btn-action btn-login" id="btnForgot" onclick="doForgot()">📨 Enviar enlace</button>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            sendEmailVerification,
            sendPasswordResetEmail,
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence,
            browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyAzDl7gaS48JoXt9OoCPzG9FyaVPz_O34I",
            authDomain: "ridertrack-93c8a.firebaseapp.com",
            projectId: "ridertrack-93c8a",
            storageBucket: "ridertrack-93c8a.firebasestorage.app",
            messagingSenderId: "851606828420",
            appId: "1:851606828420:web:873a892a091394693e59d1",
            measurementId: "G-WFYCZK7HKT"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Si ya está logueado y verificado → ir directo al index
        onAuthStateChanged(auth, (user) => {
            if (user && user.emailVerified) {
                window.location.replace('index.html');
            }
        });

        // ===== HELPERS =====
        function mostrarMsg(texto, tipo) {
            const el = document.getElementById('statusMsg');
            el.textContent = texto;
            el.className = 'status-msg ' + tipo;
        }
        function ocultarMsg() {
            document.getElementById('statusMsg').className = 'status-msg';
        }
        function errorFirebase(code) {
            const msgs = {
                'auth/user-not-found':         '❌ No existe cuenta con ese correo.',
                'auth/wrong-password':         '❌ Contraseña incorrecta.',
                'auth/invalid-email':          '❌ Correo inválido.',
                'auth/email-already-in-use':   '❌ Ese correo ya está registrado.',
                'auth/weak-password':          '❌ La contraseña debe tener al menos 6 caracteres.',
                'auth/too-many-requests':      '⚠️ Demasiados intentos. Espera un momento.',
                'auth/network-request-failed': '⚠️ Sin conexión a internet.',
                'auth/invalid-credential':     '❌ Correo o contraseña incorrectos.',
            };
            return msgs[code] || '❌ Error: ' + code;
        }

        // ===== LOGIN =====
        window._doLogin = async function() {
            const email    = document.getElementById('loginEmail').value.trim();
            const pass     = document.getElementById('loginPass').value;
            const remember = document.getElementById('rememberMe').checked;
            ocultarMsg();
            if (!email || !pass) { mostrarMsg('⚠️ Completa todos los campos.', 'error'); return; }
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Ingresando...';
            try {
                const persistence = remember ? browserLocalPersistence : browserSessionPersistence;
                await setPersistence(auth, persistence);
                const cred = await signInWithEmailAndPassword(auth, email, pass);
                if (!cred.user.emailVerified) {
                    mostrarMsg('📬 Debes verificar tu correo antes de ingresar. Revisa tu bandeja.', 'info');
                    btn.disabled = false;
                    btn.innerHTML = 'Iniciar Sesión';
                    return;
                }
                mostrarMsg('✅ ¡Bienvenido!', 'success');
                setTimeout(() => window.location.replace('index.html'), 800);
            } catch (e) {
                mostrarMsg(errorFirebase(e.code), 'error');
                btn.disabled = false;
                btn.innerHTML = 'Iniciar Sesión';
            }
        };

        // ===== REGISTRO =====
        window._doRegistro = async function() {
            const email = document.getElementById('regEmail').value.trim();
            const pass  = document.getElementById('regPass').value;
            const pass2 = document.getElementById('regPass2').value;
            ocultarMsg();
            if (!email || !pass || !pass2) { mostrarMsg('⚠️ Completa todos los campos.', 'error'); return; }
            if (pass !== pass2)            { mostrarMsg('❌ Las contraseñas no coinciden.', 'error'); return; }
            if (pass.length < 6)           { mostrarMsg('❌ La contraseña debe tener al menos 6 caracteres.', 'error'); return; }
            const btn = document.getElementById('btnCrearCuenta');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Creando cuenta...';
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                await sendEmailVerification(cred.user);
                window._pendingUser = cred.user;
                document.getElementById('verifyEmailLbl').textContent = email;
                document.getElementById('verifyBox').classList.add('show');
                btn.style.display = 'none';
                ocultarMsg();
            } catch (e) {
                mostrarMsg(errorFirebase(e.code), 'error');
                btn.disabled = false;
                btn.innerHTML = '⚡ Crear mi cuenta';
            }
        };

        // ===== REENVIAR VERIFICACIÓN =====
        window._reenviarVerificacion = async function() {
            const user = window._pendingUser || auth.currentUser;
            if (!user) return;
            try {
                await sendEmailVerification(user);
                mostrarMsg('✅ Correo reenviado a ' + user.email, 'success');
            } catch(e) {
                mostrarMsg('⚠️ No se pudo reenviar: ' + e.message, 'error');
            }
        };

        // ===== RECUPERAR CONTRASEÑA =====
        window._doForgot = async function() {
            const email = document.getElementById('forgotEmail').value.trim();
            ocultarMsg();
            if (!email) { mostrarMsg('⚠️ Ingresa tu correo.', 'error'); return; }
            const btn = document.getElementById('btnForgot');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Enviando...';
            try {
                await sendPasswordResetEmail(auth, email);
                mostrarMsg('✅ Enlace enviado a ' + email + '. Revisa tu bandeja.', 'success');
            } catch(e) {
                mostrarMsg(errorFirebase(e.code), 'error');
            }
            btn.disabled = false;
            btn.innerHTML = '📨 Enviar enlace';
        };
    </script>

    <!-- UI helpers (no-module) -->
    <script>
        // Puentes hacia funciones del módulo
        function doLogin()              { window._doLogin && window._doLogin(); }
        function doRegistro()           { window._doRegistro && window._doRegistro(); }
        function reenviarVerificacion() { window._reenviarVerificacion && window._reenviarVerificacion(); }
        function doForgot()             { window._doForgot && window._doForgot(); }

        // Mostrar sección registro
        function mostrarRegistro() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerSection').classList.add('show');
            document.getElementById('forgotSection').classList.remove('show');
            document.getElementById('statusMsg').className = 'status-msg';
        }

        // Mostrar sección olvidé contraseña
        function mostrarForgot() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerSection').classList.remove('show');
            document.getElementById('forgotSection').classList.add('show');
            document.getElementById('statusMsg').className = 'status-msg';
        }

        // Volver al login
        function volverLogin() {
            document.getElementById('loginForm').style.display = 'flex';
            document.getElementById('registerSection').classList.remove('show');
            document.getElementById('forgotSection').classList.remove('show');
            document.getElementById('statusMsg').className = 'status-msg';
        }

        // Enter para login
        document.addEventListener('keydown', function(e) {
            if (e.key !== 'Enter') return;
            if (document.getElementById('loginForm').style.display !== 'none') doLogin();
        });
    </script>
</body>
