name: Build APK + Release

on:
  push:
    branches: [ main ]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📥 Install Capacitor
        run: npm install

      - name: 📱 Add Android platform
        run: npx cap add android || true

      - name: 📋 Copy web assets
        run: npx cap copy android

      - name: 🔨 Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: 🏷️ Generate version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version || '1.0.0'")
          CLEAN_VERSION=$(echo "$VERSION" | sed 's/^v//')
          TAG="v${CLEAN_VERSION}-$(date +'%Y%m%d%H%M')"
          NAME="Build $(date +'%d-%b-%Y %H:%M')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## 📦 APK generado automáticamente

            **Fecha:** ${{ steps.version.outputs.date }}

            Generado por GitHub Actions · TrackVerse Hub
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Success log
        run: |
          echo "🎉 Release creado: ${{ steps.version.outputs.tag }}"
          echo "📦 APK subido como asset"
          echo "🌐 Visible en trackverse-hub automáticamente"
