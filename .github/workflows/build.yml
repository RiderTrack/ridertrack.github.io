name: Build TrackVerse APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies (incluye plugins Capacitor del package.json)
        run: npm install --legacy-peer-deps

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/index.html
          [ -f clientetrack.html ] && cp clientetrack.html www/clientetrack.html || true
          [ -f clientes.html ] && cp clientes.html www/clientes.html || true
          [ -f pedidos.html ] && cp pedidos.html www/pedidos.html || true
          [ -f plantillas.html ] && cp plantillas.html www/plantillas.html || true
          [ -f configuracion.html ] && cp configuracion.html www/configuracion.html || true
          [ -f catalogo.html ] && cp catalogo.html www/catalogo.html || true
          [ -f estadisticas.html ] && cp estadisticas.html www/estadisticas.html || true

      - name: Initialize Capacitor
        run: npx cap init TrackVerse com.ridertrack.clientetrack --web-dir www

      - name: Remove existing android folder if present
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Sync Capacitor plugins (filesystem, share, etc.)
        run: npx cap sync android

      - name: Configure strings.xml
        run: |
          mkdir -p android/app/src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">TrackVerse</string><string name="title_activity_main">TrackVerse</string><string name="package_name">com.ridertrack.clientetrack</string><string name="custom_url_scheme">com.ridertrack.clientetrack</string></resources>' > android/app/src/main/res/values/strings.xml
          echo "✅ strings.xml creado"

      - name: Update AndroidManifest permissions (incluye storage para descargas)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application|' "$MANIFEST"

      - name: Set Gradle permissions
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Restore or generate keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "✅ Usando keystore guardado en Secrets"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          else
            echo "⚠️ No hay KEYSTORE_BASE64 — generando nuevo keystore"
            keytool -genkeypair \
              -keystore release.keystore \
              -alias trackverse \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass trackverse123 \
              -keypass trackverse123 \
              -dname "CN=TrackVerse, OU=Rudy, O=MATE, L=Lima, S=Lima, C=PE"
            echo ""
            echo "══════════════════════════════════════════════"
            echo "COPIA ESTE BASE64 Y GUARDALO EN GITHUB SECRETS"
            echo "Nombre del secret: KEYSTORE_BASE64"
            echo "══════════════════════════════════════════════"
            base64 -w 0 release.keystore
            echo ""
            echo "══════════════════════════════════════════════"
          fi

      - name: Show SHA-1
        run: keytool -list -v -keystore release.keystore -alias trackverse -storepass trackverse123 | grep "SHA1:"

      - name: Zipalign APK
        run: |
          ZIPALIGN=$(find $ANDROID_SDK_ROOT -name "zipalign" | head -1)
          $ZIPALIGN -v -p 4 android/app/build/outputs/apk/debug/app-debug.apk TrackVerse-aligned.apk

      - name: Sign APK
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT -name "apksigner" | head -1)
          $APKSIGNER sign \
            --ks release.keystore \
            --ks-key-alias trackverse \
            --ks-pass pass:trackverse123 \
            --key-pass pass:trackverse123 \
            --out TrackVerse.apk \
            TrackVerse-aligned.apk
          echo "✅ APK firmado correctamente"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackVerse-APK
          path: TrackVerse.apk
          retention-days: 30

      - name: Show APK info
        run: du -sh TrackVerse.apk
