name: Build RiderTrack APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/index.html
          [ -f clientetrack.html ] && cp clientetrack.html www/clientetrack.html || true
          [ -f navegar.html ]      && cp navegar.html www/navegar.html           || true
          find . -maxdepth 1 \( -name "*.png" -o -name "*.jpg" -o -name "*.webp" -o -name "*.svg" \) \
            ! -path "./.git/*" -exec cp {} www/ \; 2>/dev/null || true

      - name: Initialize Capacitor
        run: npx cap init RiderTrack com.ridertrack.app --web-dir www

      - name: Remove existing android folder if present
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Update AndroidManifest permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <application|' "$MANIFEST"

      - name: Set Gradle permissions
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -alias ridertrack \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ridertrack123 \
            -keypass ridertrack123 \
            -dname "CN=RiderTrack, OU=Dev, O=RiderTrack, L=Lima, S=Lima, C=PE"

      - name: ðŸ”‘ Show SHA-1 (necesario para Google Sign-In)
        run: |
          echo "===== SHA-1 FINGERPRINT ====="
          keytool -list -v \
            -keystore debug.keystore \
            -alias ridertrack \
            -storepass ridertrack123 | grep "SHA1:"
          echo "============================="

      - name: Zipalign APK
        run: |
          ZIPALIGN=$(find $ANDROID_SDK_ROOT -name "zipalign" | head -1)
          $ZIPALIGN -v -p 4 \
            android/app/build/outputs/apk/debug/app-debug.apk \
            RiderTrack-aligned.apk

      - name: Sign APK
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT -name "apksigner" | head -1)
          $APKSIGNER sign \
            --ks debug.keystore \
            --ks-key-alias ridertrack \
            --ks-pass pass:ridertrack123 \
            --key-pass pass:ridertrack123 \
            --out RiderTrack-v1.0.apk \
            RiderTrack-aligned.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RiderTrack-APK
          path: RiderTrack-v1.0.apk
          retention-days: 30

      - name: Show APK info
        run: |
          echo "âœ… APK firmado y listo"
          echo "ðŸ“¦ TamaÃ±o: $(du -sh RiderTrack-v1.0.apk | cut -f1)"
