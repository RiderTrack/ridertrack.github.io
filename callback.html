<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiderTrack — Conectando Spotify...</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0a0410;
    color:#fff;
    font-family:'Segoe UI',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    gap:20px;
  }
  .logo { font-size:3rem; }
  .title { font-size:1.2rem; font-weight:700; color:#1ED760; }
  .msg { font-size:0.85rem; color:#aaa; text-align:center; padding:0 20px; }
  .spinner {
    width:40px; height:40px;
    border:3px solid rgba(30,215,96,0.2);
    border-top-color:#1ED760;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="logo">🎵</div>
  <div class="title">Conectando Spotify...</div>
  <div class="spinner"></div>
  <div class="msg">Procesando autorización, volviendo a RiderTrack...</div>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var error = params.get('error');

  if(error){
    document.querySelector('.title').textContent = '❌ Error de autorización';
    document.querySelector('.msg').textContent = 'Cerrando...';
    setTimeout(function(){ window.location.href = 'index.html'; }, 2000);
    return;
  }

  if(!code){
    window.location.href = 'index.html';
    return;
  }

  // Guardar código y redirigir al index para procesarlo
  localStorage.setItem('sp_auth_code', code);
  window.location.href = 'index.html?sp_code=' + encodeURIComponent(code);
})();
</script>
</body>
</html>
